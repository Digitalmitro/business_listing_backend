name: Deploy to EC2

on:
  push:
    branches: [soumen]  # Change to your desired branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 13.61.104.140 >> ~/.ssh/known_hosts

      - name: Start ssh-agent and add deploy key
        run: |
          eval $(ssh-agent -s)
          ssh-add ~/.ssh/deploy_key

      - name: Test SSH Connection
        run: ssh -i ~/.ssh/deploy_key ubuntu@13.61.104.140 "echo SSH connection successful"

      - name: Clone repository from GitHub
        run: |
          git clone git@github.com:Digitalmitro/business_listing_backend.git /home/ubuntu/business_listing_backend
      
      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@13.61.104.140 << 'EOF'
          cd /home/ubuntu/business_listing_backend
          git pull origin soumen
          npm install
          pm2 restart all || pm2 start npm -- start
          sudo systemctl restart nginx || echo "NGINX not installed or configured"
          EOF
