name: Deploy to EC2

on:
  push:
    branches: [soumen]  # Change to your desired branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 13.61.104.140 >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@13.61.104.140 << 'EOF'
          cd /path/to/your/project
          git pull origin soumen  # Ensure this matches your branch
          npm install
          pm2 restart all
          sudo systemctl restart nginx
          EOF
        env:
          PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}