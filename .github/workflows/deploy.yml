name: CICD

on:
  push:
    branches: [soumen]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t soumendigitalmitro/business_list:latest .

      - name: Publish image to Docker Hub
        run: docker push soumendigitalmitro/business_list:latest

  deploy:
          needs: build
          runs-on: [self-hosted]
          steps:
            - name: Pull image from docker hub
              run: docker pull soumendigitalmitro/business_list:latest
            - name: Delete old container
              run: docker rm -f nodejs-app-container
            - name: Run docker container
              run: docker run -d -p 5001:5001 --name nodejs-app-container soumendigitalmitro/business_list