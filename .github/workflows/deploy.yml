name: Deploy to EC2

on:
  push:
    branches: [soumen]  # Change to your desired branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 13.61.104.140 >> ~/.ssh/known_hosts

      - name: Test SSH Connection
        run: ssh -i ~/.ssh/deploy_key ubuntu@13.61.104.140 "echo SSH connection successful"

      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@13.61.104.140 << 'EOF'
          # Ensure the target directory exists
          mkdir -p /home/ubuntu/business_listing_backend
          cd /home/ubuntu/business_listing_backend
          
          # Clone repository if not already present
          if [ ! -d ".git" ]; then
            git clone git@github.com:Digitalmitro/business_listing_backend.git .
          fi
          
          # Pull latest changes and install dependencies
          git pull origin soumen
          npm install
          
          # Restart application using pm2
          pm2 restart all || pm2 start npm -- start
          
          # Restart NGINX if installed
          sudo systemctl restart nginx || echo "NGINX not installed or configured"
          EOF
