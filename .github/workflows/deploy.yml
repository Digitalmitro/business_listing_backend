name: CICD

on:
  push:
    branches: [soumen]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t soumendigitalmitro/business_list:latest .

      - name: Publish image to Docker Hub
        run: docker push soumendigitalmitro/business_list:latest
  deploy:
    needs: build
    runs-on: [self-hosted]
    steps:
    - name: Pull image from Docker Hub
      run: docker pull soumendigitalmitro/business_list:latest

    - name: Delete old container
      run: docker rm -f nodejs-app-container || true

    - name: Create .env file
      run: |
        echo "PORT=5000" > /home/ubuntu/.env
        echo "MONGO_URI=${{ secrets.MONGO_URI }}" >> /home/ubuntu/.env
        echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> /home/ubuntu/.env
        echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> /home/ubuntu/.env
        echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> /home/ubuntu/.env
        echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> /home/ubuntu/.env
        echo "AWS_BUCKET_NAME=${{ secrets.AWS_BUCKET_NAME }}" >> /home/ubuntu/.env
        echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> /home/ubuntu/.env
        echo "EMAIL_USER=${{ secrets.EMAIL_USER }}" >> /home/ubuntu/.env
        echo "EMAIL_PASS=${{ secrets.EMAIL_PASS }}" >> /home/ubuntu/.env

    - name: Run Docker container with .env file
      run: |
        docker run -d \
          --env-file=/home/ubuntu/.env \
          -p 5000:5000 \
          --name nodejs-app-container \
          soumendigitalmitro/business_list:latest
